<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certifications</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <h1>My Certifications</h1>
        <section class="certifications-grid">
            <!-- Add your certificate images or details here -->
            <div class="certificate-card">
                <img src="/img/comptia security.jpg" alt="Certificate 1">
                <p>IBM CyberSecurity Assessment: CompTIA Security +& CYSA+</p>
            </div>
            <div class="certificate-card">
                <img src="/img/aws fundamental.jpg" alt="Certificate 2">
                <p>AWS Fundamentsals</p>
            </div>
            <div class="certificate-card">
                <img src="/img/node js.jpg" alt="Certificate 3">
                <p>Node.js Backend Basics with Best Practices</p>
            </div>
            <div class="certificate-card">
                <img src="/img/introduction to network.jpg" alt="Certificate 4">
                <p>CCNAv7:Introduction to Networks</p>
            </div>
            <div class="certificate-card">
                <img src="/img/switching and routing.jpg" alt="Certificate 5">
                <p>CCNAv7: Switching,Routing and Wireless Essentials</p>
            </div>
            <!-- Add more certificate cards as needed -->
        </section>
    </div>
</body>
</html>
